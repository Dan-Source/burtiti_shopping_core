services:
  db:
    image: postgres:15-alpine
    restart: on-failure
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: buriti
      POSTGRES_USER: buriti
      POSTGRES_PASSWORD: buriti
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - webnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buriti"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: on-failure
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    networks:
      - webnet
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: on-failure
    command: >
      sh -c "
        uv run python manage.py migrate --noinput &&
        uv run python manage.py collectstatic --noinput &&
        uv run gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2
      "
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings
      - POSTGRES_HOST=db
      - POSTGRES_DB=buriti
      - POSTGRES_USER=buriti
      - POSTGRES_PASSWORD=buriti
      - POSTGRES_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - webnet

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: on-failure
    command: uv run celery -A core worker -l info --concurrency=4
    volumes:
      - media_volume:/app/media
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings
      - POSTGRES_HOST=db
      - POSTGRES_DB=buriti
      - POSTGRES_USER=buriti
      - POSTGRES_PASSWORD=buriti
      - POSTGRES_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=False
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - webnet

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    restart: on-failure
    command: uv run celery -A core beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings
      - POSTGRES_HOST=db
      - POSTGRES_DB=buriti
      - POSTGRES_USER=buriti
      - POSTGRES_PASSWORD=buriti
      - POSTGRES_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=False
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - webnet

  frontend:
    build:
      context: ./frontend
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_API_URL=http://web:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    networks:
      - webnet

volumes:
  pgdata:
  static_volume:
  media_volume:

networks:
  webnet:
    driver: bridge