paths:
  /api/orders/:
    get:
      operationId: listOrders
      summary: Listar pedidos
      tags: [Pedidos]
      description: Retorna o histórico de pedidos do usuário autenticado.
      security:
        - bearerAuth: []
        - sessionAuth: []
      responses:
        "200":
          description: Lista paginada de pedidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedOrders"
        "401":
          description: Não autenticado

  /api/orders/{id}/:
    get:
      operationId: retrieveOrder
      summary: Detalhes do pedido
      tags: [Pedidos]
      description: Retorna informações completas de um pedido específico.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      security:
        - bearerAuth: []
        - sessionAuth: []
      responses:
        "200":
          description: Dados do pedido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Pedido não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    sessionAuth:
      type: apiKey
      in: cookie
      name: sessionid

  schemas:
    Error:
      $ref: "shared.yml#/Error"
    Pagination:
      $ref: "shared.yml#/Pagination"

    OrderLine:
      type: object
      description: Item de um pedido.
      required:
        - id
        - product
        - quantity
      properties:
        id:
          type: integer
          example: 1
        product:
          $ref: "#/components/schemas/ProductItem"
        quantity:
          type: integer
          example: 1
        line_price_incl_tax:
          type: string
          nullable: true
          description: Preço total da linha no pedido
          example: "1190.00"

    ProductItem:
      type: object
      description: Versão resumida do produto para uso em pedidos.
      required:
        - id
        - name
        - price
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          nullable: true
          example: "Smartphone Galaxy S25 Ultra"
        name:
          type: string
          example: "Smartphone Samsung Galaxy S25 Ultra 512GB"
        slug:
          type: string
          example: "smartphone-samsung-galaxy-s25-ultra-512gb"
        image:
          type: string
          format: uri
          nullable: true
          example: "https://cdn.buriti.com/media/products/1/thumb.jpg"
        price:
          $ref: "#/components/schemas/Price"
        stock:
          type: integer
          example: 50
          minimum: 0
        is_on_sale:
          type: boolean
          example: true

    Price:
      $ref: "shared.yml#/Price"

    Order:
      type: object
      description: Pedido confirmado.
      required:
        - id
        - status
      properties:
        id:
          type: integer
          example: 1
        number:
          type: string
          nullable: true
          description: Número do pedido (legível para o cliente)
          example: "OSCAR-2025-000001"
        status:
          type: string
          description: Status atual do pedido
          example: "Processing"
        payment_status:
          type: string
          nullable: true
          description: |
            Status de pagamento para fluxos assíncronos (ex.: PIX).
            Valores comuns: `pending`, `paid`, `expired`.
          example: "pending"
        date_placed:
          type: string
          format: date-time
          nullable: true
          description: Data de realização
          example: "2025-06-15T14:30:00Z"
        total_incl_tax:
          type: string
          nullable: true
          description: Total do pedido com imposto
          example: "1190.00"
        pix_qr_code_image:
          type: string
          format: uri
          nullable: true
          description: URL ou data URI da imagem do QR Code PIX
          example: "https://api.buritishopping.com.br/media/pix/qr/order-1.png"
        pix_qr_code:
          type: string
          nullable: true
          description: Conteúdo bruto do QR Code (quando aplicável)
          example: "00020101021226860014br.gov.bcb.pix..."
        pix_copy_paste:
          type: string
          nullable: true
          description: Chave/linha digitável copia e cola do PIX
          example: "00020101021226860014br.gov.bcb.pix..."
        pix_expires_at:
          type: string
          format: date-time
          nullable: true
          description: Data/hora de expiração do pagamento PIX
          example: "2026-07-03T22:00:00Z"
        lines:
          type: array
          nullable: true
          description: Itens do pedido
          items:
            $ref: "#/components/schemas/OrderLine"

    PaginatedOrders:
      type: object
      description: Resposta paginada de pedidos.
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required:
            - results
          properties:
            results:
              type: array
              description: Lista de pedidos da página atual
              items:
                $ref: "#/components/schemas/Order"
